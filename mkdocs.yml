site_name: OPENLABLOG
site_url: https://openlablog.is-a.dev/
copyright: "&copy; OPENLABLOG"
use_directory_urls: false

theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  icon:
    logo: material/book-education-outline
  favicon: assets/images/favicon.png
  features:
    - content.code.copy
    - content.code.annotate
    - content.footnote.tooltips
    - navigation.top
    - navigation.path
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/lightbulb-outline
        name: 切换到暗黑模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/lightbulb
        name: 切换到明亮模式
        
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - tables
  - footnotes
  
plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
          remove_comments: true
          remove_optional_attribute_quotes: false
  - exclude:
      glob:
        - ".obsidian/*"
        - "*.tmp"

extra_javascript:
  - assets/javascripts/extra.js

extra:
  generator: false
